name: bench-kit lint
description: Check a bench repo against the bench standard (bench-kit lint, rules BL001-BL010).
inputs:
  args:
    description: Extra arguments for bench-kit lint, e.g. --warn-only
    required: false
    default: ""
  path:
    description: Repo root to check
    required: false
    default: "."
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install bench-kit
      shell: bash
      run: python -m pip install --quiet "${{ github.action_path }}"
    - name: bench-kit lint
      shell: bash
      run: bench-kit lint "${{ inputs.path }}" --format github ${{ inputs.args }}
