[project]
name = "bench-kit"
version = "0.4.0"
license = "MIT"
description = "Shared standard, schema, renderer, stats and linter for bench repos"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.18"]

[project.scripts]
bench-kit = "bench_kit.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bench_kit"]

[tool.hatch.build.targets.wheel.force-include]
"schema" = "bench_kit/schema"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 150
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
